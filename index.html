<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>微型群組聊天室</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #e2e8f0; margin: 0; padding: 20px 20px 80px 20px; display: flex; justify-content: center; }
    .card { width: 100%; max-width: 480px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; }
    .header { background: #2563eb; color: white; padding: 15px; text-align: center; }
    .header h2 { margin: 0; font-size: 18px; }
    .content { padding: 20px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; color: #475569; margin-bottom: 4px; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    .form-group input:focus { outline: none; border-color: #2563eb; }
    
    /* ERR_2001 專用紅字提示 */
    .inline-error {
      color: #dc2626;
      font-size: 12px;
      margin-top: 5px;
      display: none;
      font-weight: bold;
    }

    .btn-group { display: flex; gap: 8px; margin-top: 15px; }
    button { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; background: #2563eb; font-size: 14px; }
    button.secondary { background: #64748b; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    
    /* 聊天室主畫面 */
    #chatSection { display: none; height: 85vh; flex-direction: column; }
    .chat-header { padding: 12px 15px; background: #1e40af; color: white; display: flex; justify-content: space-between; align-items: center; }
    .chat-controls { display: flex; gap: 6px; padding: 8px 15px; background: #f1f5f9; border-bottom: 1px solid #cbd5e1; }
    .chat-controls input { padding: 6px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 13px; }
    .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #f8fafc; }
    .msg-bubble { padding: 8px 12px; border-radius: 8px; max-width: 80%; background: #ffffff; border: 1px solid #e2e8f0; font-size: 14px; }
    .msg-bubble.self { align-self: flex-end; background: #dbeafe; border-color: #bfdbfe; }
    .msg-user { font-size: 11px; font-weight: bold; color: #64748b; margin-bottom: 2px; }
    .msg-img { max-width: 100%; border-radius: 6px; margin-top: 5px; display: block; }
    .msg-time { font-size: 9px; color: #94a3b8; margin-top: 4px; text-align: right; }
    .chat-input-area { padding: 10px; border-top: 1px solid #cbd5e1; display: flex; gap: 6px; align-items: center; background: white; }
    .chat-input-area input[type="text"] { flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; }
    .chat-input-area input[type="file"] { display: none; }
    .upload-btn { background: #e2e8f0; color: #334155; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }

    /* 底部彈出式錯誤條 */
    #errorBanner {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 30px);
      max-width: 480px;
      background: #ef4444;
      color: white;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.35);
      display: none;
      justify-content: space-between;
      align-items: center;
      z-index: 9999;
      animation: fadeIn 0.3s ease-in-out;
    }
    #errorBanner strong { font-family: monospace; font-size: 14px; background: rgba(0,0,0,0.2); padding: 2px 6px; border-radius: 4px; margin: 0 4px; }
    .close-error-btn { background: transparent; border: none; color: white; font-size: 16px; font-weight: bold; cursor: pointer; padding: 0 4px; }
    @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
  </style>
</head>
<body>

  <!-- 登入與註冊頁面 -->
  <div class="card" id="authSection">
    <div class="header">
      <h2>微型聊天室 - 身份驗證</h2>
    </div>
    <div class="content">
      <div class="form-group">
        <label>帳號</label>
        <input type="text" id="authUsername" placeholder="請輸入使用者名稱" oninput="clearInlineError()">
        <div id="authInlineError" class="inline-error">註冊時帳號名稱已被使用</div>
      </div>
      <div class="form-group">
        <label>密碼</label>
        <input type="password" id="authPassword" placeholder="請輸入密碼">
      </div>
      <div class="btn-group">
        <button id="loginBtn" onclick="handleLogin()">登入</button>
        <button id="registerBtn" class="secondary" onclick="handleRegister()">註冊新帳號</button>
      </div>
    </div>
  </div>

  <!-- 聊天室主畫面 -->
  <div class="card" id="chatSection">
    <div class="chat-header">
      <span id="currentUserLabel">使用者: -</span>
      <button class="secondary" style="flex: 0; padding: 4px 8px; font-size: 12px;" onclick="logout()">登出</button>
    </div>
    <div class="chat-controls">
      <span style="font-size: 13px; align-self: center;">當前群組:</span>
      <input type="text" id="roomInput" value="大廳" style="width: 100px;">
      <button style="flex:0; padding: 6px 12px;" onclick="switchRoom()">切換</button>
    </div>
    <div class="chat-box" id="chatBox">
      <div style="text-align: center; color: #94a3b8; font-size: 12px;">載入中...</div>
    </div>
    <div class="chat-input-area">
      <label class="upload-btn" for="imageInput">📷 圖片</label>
      <input type="file" id="imageInput" accept="image/png" onchange="previewImage(event)">
      <input type="text" id="msgText" placeholder="輸入訊息..." onkeydown="if(event.key==='Enter') sendMsg()">
      <button style="flex:0; padding: 10px 16px;" id="sendBtn" onclick="sendMsg()">送出</button>
    </div>
    <div id="imagePreviewNote" style="font-size: 11px; color: #2563eb; padding: 0 10px 6px; display: none;">已選取圖片</div>
  </div>

  <!-- 底部彈出式錯誤條 -->
  <div id="errorBanner">
    <span id="errorBannerText">出現錯誤</span>
    <button class="close-error-btn" onclick="hideBottomError()">✕</button>
  </div>

  <script>
    // ================= 動態網址參數抓取 =================
    const urlParams = new URLSearchParams(window.location.search);
    const urlApi = urlParams.get('api'); // 接收 ?api=...
    const urlKey = urlParams.get('key'); // 接收 ?key=...

    // 若網址帶有參數，儲存至瀏覽器本機快取
    if (urlApi) localStorage.setItem("chat_api_url", decodeURIComponent(urlApi));
    if (urlKey) localStorage.setItem("chat_system_key", urlKey);

    // 取得當前工作金鑰與 API 位址
    const API_URL = localStorage.getItem("chat_api_url") || "";
    const API_KEY = localStorage.getItem("chat_system_key") || "";

    // 抹除網址列參數，保持網址整潔安全
    if (urlApi || urlKey) {
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    let currentUser = localStorage.getItem("chat_user") || "";
    let currentRoom = "大廳";
    let selectedImageBase64 = null;
    let pollTimer = null;
    let errorTimeout = null;

    // 啟動驗證權限
    window.addEventListener("DOMContentLoaded", () => {
      if (!API_URL || !API_KEY) {
        showBottomError("ERR_1001", "未授權存取：缺少 API 伺服器網址或通行金鑰，請透過專屬授權網址進入！");
        document.getElementById("loginBtn").disabled = true;
        document.getElementById("registerBtn").disabled = true;
      } else if (currentUser) {
        showChat();
      }
    });

    function clearInlineError() {
      document.getElementById("authInlineError").style.display = "none";
    }

    function showBottomError(code, message) {
      const banner = document.getElementById("errorBanner");
      const text = document.getElementById("errorBannerText");
      text.innerHTML = `⚠️ 出現錯誤！<strong>[${code}]</strong> ${message}`;
      banner.style.display = "flex";

      if (errorTimeout) clearTimeout(errorTimeout);
      errorTimeout = setTimeout(hideBottomError, 8000);
    }

    function hideBottomError() {
      document.getElementById("errorBanner").style.display = "none";
    }

    // 登入
    async function handleLogin() {
      clearInlineError();
      const u = document.getElementById("authUsername").value.trim();
      const p = document.getElementById("authPassword").value.trim();
      if (!u || !p) return showBottomError("ERR_2003", "請輸入帳號與密碼");

      const res = await apiPost({ action: "login", username: u, password: p });
      if (res.status === "success") {
        currentUser = res.user;
        localStorage.setItem("chat_user", currentUser);
        hideBottomError();
        showChat();
      } else {
        showBottomError(res.error_code || "ERR_9999", res.error_message || "登入失敗");
      }
    }

    // 註冊 (攔截 ERR_2001)
    async function handleRegister() {
      clearInlineError();
      hideBottomError();

      const u = document.getElementById("authUsername").value.trim();
      const p = document.getElementById("authPassword").value.trim();
      if (!u || !p) return showBottomError("ERR_2003", "請輸入帳號與密碼");

      const res = await apiPost({ action: "register", username: u, password: p });

      if (res.status === "success") {
        alert("註冊成功！請直接點擊登入");
      } else {
        if (res.error_code === "ERR_2001") {
          const inlineErr = document.getElementById("authInlineError");
          inlineErr.innerText = "註冊時帳號名稱已被使用";
          inlineErr.style.display = "block";
          document.getElementById("authUsername").focus();
        } else {
          showBottomError(res.error_code || "ERR_9999", res.error_message || "註冊失敗");
        }
      }
    }

    function showChat() {
      document.getElementById("authSection").style.display = "none";
      document.getElementById("chatSection").style.display = "flex";
      document.getElementById("currentUserLabel").innerText = `使用者: ${currentUser}`;
      loadMessages();
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(loadMessages, 3500);
    }

    function logout() {
      localStorage.removeItem("chat_user");
      currentUser = "";
      clearInterval(pollTimer);
      document.getElementById("chatSection").style.display = "none";
      document.getElementById("authSection").style.display = "block";
      clearInlineError();
      hideBottomError();
    }

    function switchRoom() {
      currentRoom = document.getElementById("roomInput").value.trim() || "大廳";
      loadMessages();
    }

    // 讀取訊息
    async function loadMessages() {
      try {
        const url = `${API_URL}?apiKey=${encodeURIComponent(API_KEY)}&room=${encodeURIComponent(currentRoom)}`;
        const res = await fetch(url);
        const data = await res.json();
        
        if (data.status === "success") {
          renderMessages(data.messages);
        } else {
          showBottomError(data.error_code || "ERR_9999", data.error_message || "讀取訊息異常");
        }
      } catch (e) {
        showBottomError("ERR_9999", "無法連線至後端伺服器");
      }
    }

    function renderMessages(messages) {
      const box = document.getElementById("chatBox");
      box.innerHTML = "";

      if (!messages || messages.length === 0) {
        box.innerHTML = `<div style="text-align:center;color:#94a3b8;font-size:12px;margin-top:20px;">群組「${currentRoom}」尚無訊息</div>`;
        return;
      }

      messages.forEach(m => {
        const isSelf = m.user === currentUser;
        const bubble = document.createElement("div");
        bubble.className = `msg-bubble ${isSelf ? 'self' : ''}`;
        
        let imgHtml = m.image ? `<a href="${m.image}" target="_blank"><img src="${m.image}" class="msg-img" alt="圖片"></a>` : "";
        let timeStr = m.time ? new Date(m.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : "";

        bubble.innerHTML = `
          <div class="msg-user">${m.user}</div>
          <div>${m.msg}</div>
          ${imgHtml}
          <div class="msg-time">${timeStr}</div>
        `;
        box.appendChild(bubble);
      });

      box.scrollTop = box.scrollHeight;
    }

    // 圖片選取
    function previewImage(e) {
      const file = e.target.files[0];
      if (!file) return;

      if (file.type !== "image/png") {
        showBottomError("ERR_3002", "格式不符：僅支援 PNG 圖片！");
        e.target.value = "";
        return;
      }

      const reader = new FileReader();
      reader.onload = function(evt) {
        selectedImageBase64 = evt.target.result;
        document.getElementById("imagePreviewNote").style.display = "block";
        document.getElementById("imagePreviewNote").innerText = `已選取 PNG (${Math.round(file.size / 1024)} KB)`;
        hideBottomError();
      };
      reader.readAsDataURL(file);
    }

    // 發送訊息
    async function sendMsg() {
      const txtInput = document.getElementById("msgText");
      const msg = txtInput.value.trim();

      if (!msg && !selectedImageBase64) {
        return showBottomError("ERR_3001", "請輸入文字或選取圖片");
      }

      const btn = document.getElementById("sendBtn");
      btn.disabled = true;

      const payload = {
        action: "sendMessage",
        user: currentUser,
        room: currentRoom,
        msg: msg,
        image: selectedImageBase64
      };

      txtInput.value = "";
      selectedImageBase64 = null;
      document.getElementById("imageInput").value = "";
      document.getElementById("imagePreviewNote").style.display = "none";

      const res = await apiPost(payload);
      btn.disabled = false;

      if (res.status === "success") {
        hideBottomError();
        loadMessages();
      } else {
        showBottomError(res.error_code || "ERR_9999", res.error_message || "發送訊息失敗");
      }
    }

    // 通用 POST 請求
    async function apiPost(data) {
      data.apiKey = API_KEY;
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(data)
        });
        return await res.json();
      } catch (err) {
        return { error_code: "ERR_9999", error_message: "連線異常: " + err.toString() };
      }
    }
  </script>
</body>
</html>
